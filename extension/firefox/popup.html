<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grabr</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary-start: #fbbf24;
      --primary-end: #d97706;
      --danger: #ef4444;
      --success: #22c55e;
      --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-stack);
      background-color: var(--bg-main);
      color: var(--text-main);
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Fixed dimensions when loaded as a Chrome extension toolbar popup */
    body.toolbar-popup {
      width: 420px;
      height: 480px; /* Slightly taller to accommodate active list */
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-container {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
    }

    .logo-arrow {
      width: 14px;
      height: 14px;
      border-left: 3px solid white;
      border-bottom: 3px solid white;
      transform: rotate(-45deg) translate(2px, -2px);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(to right, var(--text-main), var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.2);
      transition: all 0.3s ease;
    }

    .status-badge.online {
      background-color: rgba(34, 197, 94, 0.15);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.2);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: currentColor;
    }

    main {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Custom scrollbar for active jobs list */
    main::-webkit-scrollbar {
      width: 6px;
    }
    main::-webkit-scrollbar-track {
      background: transparent;
    }
    main::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .info-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .info-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .info-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
    }

    .info-value {
      font-size: 14px;
      word-break: break-all;
      line-height: 1.4;
    }

    .info-value.url {
      color: var(--primary-start);
      font-family: monospace;
      font-size: 12px;
      max-height: 50px;
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.6);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid rgba(51, 65, 85, 0.5);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .input-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
    }

    input[type="text"], input[type="number"], input[type="checkbox"] {
      background-color: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-main);
      font-family: var(--font-stack);
      font-size: 14px;
      transition: all 0.2s ease;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    input:focus {
      outline: none;
      border-color: var(--primary-start);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
    }

    footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border-color);
      background-color: rgba(30, 41, 59, 0.4);
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .btn {
      font-family: var(--font-stack);
      font-size: 14px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-secondary {
      background-color: transparent;
      border-color: var(--border-color);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: var(--bg-card);
      border-color: var(--text-muted);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      color: white;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.3);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    #error-alert {
      display: none;
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 4px;
    }

    /* -------------------------------------------------------------
     * MINI-DASHBOARD CUSTOM STYLES
     * ------------------------------------------------------------- */
    .mini-job-row {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.25s ease;
    }

    .mini-job-row.completed {
      border-color: rgba(34, 197, 94, 0.3);
    }

    .mini-job-row.failed {
      border-color: rgba(239, 68, 68, 0.3);
    }

    .mini-job-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .mini-job-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-grow: 1;
      max-width: 250px;
    }

    .mini-job-progress-bar-bg {
      height: 4px;
      background-color: var(--border-color);
      border-radius: 2px;
      overflow: hidden;
      width: 100%;
    }

    .mini-job-progress-bar {
      height: 100%;
      background: linear-gradient(to right, var(--primary-start), var(--primary-end));
      width: 0%;
      transition: width 0.2s ease;
    }

    .mini-job-progress-bar.completed {
      background: var(--success);
    }

    .mini-job-progress-bar.failed {
      background: var(--danger);
    }

    .mini-job-stats {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
      font-family: monospace;
    }

    .mini-job-actions {
      display: flex;
      gap: 8px;
    }

    .mini-action-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    .mini-action-btn:hover {
      color: var(--text-main);
    }

    .mini-action-btn.btn-delete:hover {
      color: var(--danger);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo-container">
        <div class="logo-arrow"></div>
      </div>
      <div class="brand-title">Grabr</div>
    </div>
    <div class="status-badge" id="status-badge">
      <div class="status-dot"></div>
      <span id="status-text">Checking daemon...</span>
    </div>
  </header>

  <!-- Download Mode Layout (visible when URL is intercepted) -->
  <div id="download-layout" style="display: none; flex: 1; flex-direction: column; overflow: hidden;">
    <main>
      <div id="error-alert"></div>

      <div class="info-card">
        <div class="info-row">
          <span class="info-label">Source URL</span>
          <div class="info-value url" id="file-url">-</div>
        </div>
        <div class="info-row">
          <span class="info-label">File Size</span>
          <span class="info-value" id="file-size">Checking...</span>
        </div>
      </div>

      <div class="form-group">
        <label for="filename">Filename</label>
        <input type="text" id="filename" placeholder="e.g. archive.zip">
      </div>

      <!-- YouTube Format selection (hidden by default) -->
      <div class="form-group" id="yt-format-group" style="display: none;">
        <label for="yt-format">Choose Format</label>
        <select id="yt-format" style="width: 100%; background-color: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 12px; color: var(--text-main); font-family: var(--font-stack); font-size: 14px; outline: none; transition: border-color 0.2s ease;">
          <option value="">Analyzing YouTube video formats...</option>
        </select>
      </div>

      <div class="input-row">
        <div class="form-group">
          <label for="output-dir">Save Directory</label>
          <input type="text" id="output-dir" placeholder="Default (defined in daemon)">
        </div>
        <div class="form-group">
          <label for="chunks">Parallel Chunks</label>
          <input type="number" id="chunks" min="1" max="32" value="4">
        </div>
      </div>
    </main>

    <footer>
      <button class="btn btn-secondary" id="btn-cancel">Cancel</button>
      <button class="btn btn-secondary" id="btn-chrome">Download with Chrome</button>
      <button class="btn btn-primary" id="btn-grabr" disabled>Send to Grabr</button>
    </footer>
  </div>

  <!-- Status / Control Mode Layout (visible when clicked in toolbar) -->
  <div id="status-layout" style="display: none; flex: 1; flex-direction: column; overflow: hidden;">
    <main>
      <div class="info-card" style="align-items: center; justify-content: center; text-align: center; padding: 14px 20px; gap: 4px;">
        <h2 style="font-size: 14px; font-weight: 700;">Grabr Background Daemon</h2>
        <p id="daemon-url-display" style="font-size: 12px; color: var(--text-muted); font-family: monospace;">http://127.0.0.1:7474</p>
      </div>

      <div class="info-card" style="gap: 12px; padding: 12px 16px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div>
            <div style="font-size: 13px; font-weight: 600;">Interception Status</div>
            <div style="font-size: 11px; color: var(--text-muted);">Intercept browser downloads</div>
          </div>
          <input type="checkbox" id="toggle-active">
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border-color); padding-top: 12px;">
          <div>
            <div style="font-size: 13px; font-weight: 600;">Intercept All Files</div>
            <div style="font-size: 11px; color: var(--text-muted);">Ignore file extension rules</div>
          </div>
          <input type="checkbox" id="toggle-intercept-all">
        </div>
      </div>

      <!-- Active Downloads Section (Mini-Dashboard) -->
      <div id="active-downloads-section" style="display: none; flex-direction: column; gap: 8px;">
        <span class="info-label">Active Downloads</span>
        <div id="active-jobs-list" style="display: flex; flex-direction: column; gap: 8px;">
          <!-- Dynamic Job Rows -->
        </div>
      </div>

      <!-- Links Section -->
      <div style="display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border-color); padding-top: 12px;">
        <a href="https://www.npmjs.com/package/@linuxctrl/grabr" target="_blank" rel="noopener noreferrer" style="color: var(--primary-start); font-size: 11px; text-decoration: none;">📦 npm Package</a>
        <a href="https://github.com/LinuxCTRL/grabr" target="_blank" rel="noopener noreferrer" style="color: var(--primary-start); font-size: 11px; text-decoration: none;">🐙 GitHub</a>
        <a href="https://grabr-deploy.vercel.app/" target="_blank" rel="noopener noreferrer" style="color: var(--primary-start); font-size: 11px; text-decoration: none;">📖 Documentation</a>
      </div>
    </main>

    <footer>
      <button class="btn btn-secondary" id="btn-open-options" style="flex: 1; justify-content: center;">
        Settings
      </button>
      <button class="btn btn-primary" id="btn-open-webui" style="flex: 1; justify-content: center;" disabled>
        Open Web UI
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
